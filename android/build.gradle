// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Health Connect 1.1.0 needs AGP 8.9.1+ and compileSdk 36. AGP 8.x can't run on
        // Gradle 9.6+, so the wrapper stays on Gradle 8.14.3.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'
        // Kotlin for the Health Connect plugin (app/src/main/java/com/ironlog/app/HealthConnectPlugin.kt)
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    tasks.matching { it.name.startsWith("lintVital") }.configureEach {
        enabled = false
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
